
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "profit-solver"
version = "0.0.1"
description = "Prototype for a search‑based profit maximization engine"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.28.0",
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "click>=8.1.0",
]

[project.scripts]
profit-solver = "solver.cli:main"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
